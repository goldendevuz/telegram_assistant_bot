name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff (xatolar)
        run: uvx ruff@0.17.3 check --select F,E9 main.py web.py storage.py

  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Image build
        run: docker build -t telegram_assistant_bot:ci .
      - name: Healthcheck skripti (heartbeat yo'q bo'lsa xato berishi kerak)
        run: |
          if docker run --rm --entrypoint python telegram_assistant_bot:ci -c "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/bot_heartbeat') < 180 else 1)"; then
            echo "Kutilmagan: heartbeat mavjud"; exit 1
          fi
          echo "OK: heartbeat yo'qligida healthcheck xato beradi"
